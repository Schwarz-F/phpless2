<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>~fabian // travelmap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/simple.css">
<style>
  /* Verhindert horizontales Floaten, bricht sauber nach unten um */
  .place {
    display: block !important;
    width: 100%;
    margin-bottom: 12px;
    user-select: none;
  }

  /* Ordner-Detail-Box unter dem Listeneintrag */
  .list-gallery-box {
    margin-top: 10px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.055);
    border-left: 3px solid #b1b1b1;
    border-radius: 0 4px 4px 4px;
    font-size: 0.95rem;
  }
  
  .list-gallery-box .folder-title {
    font-weight: bold;
    color: #9e76e9;
    margin-bottom: 8px;
  }

  .date-item {
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
  }
  .date-item:last-child {
    border-bottom: none;
    margin-bottom: 0;
  }

  /* Klickbare Datumszeile */
  .date-header-hover{
    cursor: pointer;
    display: block;
    user-select: none;
    padding: 2px 0;
    color: var(--accent);
  }
  .date-header{
    display: block;
    user-select: none;
    padding: 2px 0;
    color: var(--accent);
  }
  .date-header-hover:hover {
    color: #4fc7ad;
  }

  .date-comment {
    display: inline-block;
    font-size: 0.88rem;
    color: #ccc;
    padding-left: 12px;
    margin-top: 2px;
    font-style: italic;
  }

  /* Bilder-Grid (wird erst bei Klick sichtbar) */
  .list-gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
    margin-top: 8px;
    padding-left: 12px;
  }
  .list-gallery-grid img {
    width: 100%;
    height: 60px;
    object-fit: cover;
    cursor: pointer;
    border-radius: 3px;
    transition: transform 0.2s;
  }
  .list-gallery-grid img:hover {
    transform: scale(1.05);
  }
</style>
</head>
<body class="music-bg">
<div class="wrap">
  <nav class="nav">
    <a class="home" href="/index.html">~/fabian</a>
    <a href="/travelmap.html">/travelmap</a>
    <a href="/suggestions.html">/suggestions</a>
    <a href="/music.html">/music</a>
    <a href="/desktop.html">/desktop</a>
  </nav>
  <div class="main">
    <div class="head"><h1>travelmap<span class="blink">_</span></h1></div>
    <span class="note">// Where I've been and wanna go</span>
    <div id="map"></div>

    <ul id="place-list"><li class="note">// lädt…</li></ul>
     <div id="app"></div>
  </div>
 
</div>

<div id="lightbox"><img src="" alt=""></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/travelmap.js"></script>
<script src="js/global.js"></script>

</body>
</html>
