name: Update YouTube Feed

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wichtig, damit die Action die Datei speichern darf

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Feed herunterladen und konvertieren
      run: python fetch_youtube.py

    - name: Änderungen ins Repository pushen
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/youtube.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automatisches Update des YouTube-Feeds" && git push)
